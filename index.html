<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Impossible Cylinders</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #edf4f2;
      --muted: #9bb0ae;
      --line: #294348;
      --panel: #102024;
      --accent: #67c4ef;
      --figure: #3188b8;
      --figure-edge: #b8e4f7;
      --figure-fill: rgba(49, 136, 184, .14);
      --axis: #f2b35b
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #071114;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif
    }

    body {
        overflow: auto
      }

      html,
      body {
        height: 100%;
        overflow: hidden
      }

      .app {
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(200px, 24%) 8px minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        grid-template-areas:
          "header header stages"
          "left   divider stages";
        background: radial-gradient(circle at 78% 12%, #18373a 0, #071114 42%, #050b0d 100%)
      }

      header {
        grid-area: header;
        padding: 12px clamp(14px, 3vw, 32px) 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: 6px
      }

      h1 {
        margin: 0;
        font-size: clamp(17px, 2.1vw, 26px);
        font-weight: 400;
        letter-spacing: .02em
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif
      }

      .status {
        color: var(--accent);
        font: 12px ui-monospace, monospace;
        white-space: nowrap
      }

      .header-row {
        display: flex;
        align-items: center;
        gap: 14px
      }

      .btn {
        color: var(--ink);
        background: #0b181b;
        border: 1px solid #35545a;
        border-radius: 4px;
        padding: 7px 12px;
        font: 12px ui-sans-serif, system-ui, sans-serif;
        cursor: pointer
      }

      .btn:hover {
        border-color: var(--accent);
        color: var(--accent)
      }

      .btn:disabled {
        opacity: .45;
        cursor: not-allowed
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #06211d;
        font-weight: 600
      }

      .btn.primary:hover {
        color: #06211d;
        opacity: .9
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: rgba(4, 10, 12, .72);
        padding: 20px
      }

      .modal-overlay[hidden] {
        display: none
      }

      .modal {
        width: min(480px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: linear-gradient(145deg, rgba(25, 47, 51, .97), rgba(10, 22, 25, .99));
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, .4)
      }

      .modal-head {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line)
      }

      .modal-head h2 {
        margin: 0 0 4px;
        font: 400 16px Georgia, serif
      }

      .modal-head p {
        margin: 0;
        color: var(--muted);
        font: 12px ui-sans-serif, system-ui, sans-serif
      }

      .modal-body {
        padding: 14px 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px
      }

      .modal-body .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font: 11px ui-sans-serif, system-ui, sans-serif;
        color: var(--muted)
      }

      .modal-body .field.span2 {
        grid-column: 1 / -1
      }

      .modal-body .field.row {
        flex-direction: row;
        align-items: center;
        gap: 8px
      }

      .modal-body input[type=number],
      .modal-body input[type=text] {
        color: var(--ink);
        background: #0b181b;
        border: 1px solid #35545a;
        border-radius: 4px;
        padding: 7px 8px;
        font: 12px ui-sans-serif, system-ui, sans-serif;
        width: 100%
      }

      .modal-body input:disabled {
        opacity: .4
      }

      .modal-body label.chk {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink);
        font: 12px ui-sans-serif, system-ui, sans-serif
      }

      .modal-body label.chk input {
        accent-color: var(--accent)
      }

      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 18px;
        border-top: 1px solid var(--line)
      }

      .workspace {
        display: contents
      }

      .left {
        grid-area: left;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 14px;
        padding: 14px 0 18px 18px
      }

      .divider {
        grid-area: divider;
        cursor: col-resize;
        position: relative;
        margin: 14px 12px 18px;
        border-left: 1px solid var(--line)
      }

      .divider:after {
        content: "⋮";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--muted);
        background: #071114;
        padding: 6px 0;
        font: 22px serif
      }

      .panel {
        min-height: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        background: linear-gradient(145deg, rgba(25, 47, 51, .9), rgba(10, 22, 25, .95));
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 55px rgba(0, 0, 0, .18)
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
        font: 12px ui-sans-serif, system-ui, sans-serif
      }

      .panel-head strong {
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase
      }

      .panel-head span {
        color: var(--muted)
      }

      .preview {
        min-height: 0;
        position: relative;
        display: grid;
        place-items: center;
        padding: 12px;
        background: repeating-linear-gradient(0deg, transparent 0 23px, rgba(255, 255, 255, .025) 24px), repeating-linear-gradient(90deg, transparent 0 23px, rgba(255, 255, 255, .025) 24px)
      }

      .preview:before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(103, 196, 239, .14);
        pointer-events: none
      }

      .preview svg {
        width: 100%;
        height: 100%;
        max-height: 260px;
        filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .28))
      }

      .preview path,
      .preview circle,
      .preview rect,
      .preview ellipse,
      .preview line,
      .preview polygon,
      .preview polyline {
        fill: var(--figure-fill);
        stroke: var(--figure-edge);
        stroke-width: 5;
        vector-effect: non-scaling-stroke;
        stroke-linejoin: round
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 9px;
        border-top: 1px solid var(--line);
        font: 12px ui-sans-serif, system-ui, sans-serif
      }

      .controls label.chk {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        font: 11px ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap
      }

      .controls label.chk input {
        accent-color: var(--accent)
      }

      .transform-controls {
        display: flex;
        flex-basis: 100%;
        gap: 8px;
        flex-wrap: wrap
      }

      .controls .file-control {
        flex: 0 0 100%;
        max-width: none
      }

      select,
      input[type=file] {
        min-width: 0;
        color: var(--ink);
        background: #0b181b;
        border: 1px solid #35545a;
        border-radius: 4px;
        padding: 7px 8px;
        font: 12px ui-sans-serif, system-ui, sans-serif
      }

      select {
        flex: 1
      }

      input[type=file] {
        max-width: 130px;
        padding: 5px;
        color: var(--muted)
      }

      .stages {
        grid-area: stages;
        min-width: 0;
        min-height: 0;
        position: relative;
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 12px
      }

      .stage {
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #081417;
        box-shadow: 0 25px 80px rgba(0, 0, 0, .25)
      }

      .scene-canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab
      }

      .scene-canvas.dragging {
        cursor: grabbing
      }

      .hud {
        position: absolute;
        inset: 14px 16px auto;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        font: 11px ui-monospace, monospace;
        color: #b1c5c6
      }

      .hud b {
        color: var(--accent);
        font-weight: 400
      }

      .legend {
        position: absolute;
        bottom: 14px;
        left: 16px;
        color: #92aaac;
        font: 11px ui-sans-serif, system-ui, sans-serif;
        pointer-events: none
      }

      .scene-controls {
        position: absolute;
        right: 16px;
        bottom: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        background: rgba(7, 17, 20, .88);
        border: 1px solid #35545a;
        border-radius: 5px;
        font: 11px ui-sans-serif, system-ui, sans-serif
      }

      .range-control {
        display: flex;
        align-items: center;
        gap: 7px
      }

      .range-control label,
      .range-control output {
        color: #b1c5c6;
        white-space: nowrap
      }

      .range-control input {
        width: clamp(90px, 12vw, 150px);
        accent-color: var(--accent)
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 30px;
        text-align: center;
        color: var(--muted);
        font: 14px ui-sans-serif, system-ui, sans-serif
      }

      @media(max-width:760px) {

        html,
        body {
          height: auto;
          overflow: auto
        }

        .app {
          height: auto;
          min-height: 100vh;
          overflow: visible;
          display: flex;
          flex-direction: column;
          padding: 10px;
          gap: 10px
        }

        header {
          padding: 0 0 10px
        }

        .left {
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-template-rows: none;
          gap: 10px;
          padding: 0
        }

        .panel {
          min-height: 200px
        }

        .divider {
          height: 8px;
          margin: 0;
          border-left: 0;
          border-top: 1px solid var(--line);
          cursor: row-resize
        }

        .divider:after {
          content: "⋯"
        }

        .stages {
          grid-template-rows: 1fr 1fr;
          min-height: 58vh;
          gap: 10px
        }

        .controls {
          align-items: stretch;
          flex-direction: column
        }

        input[type=file] {
          max-width: none
        }
      }

      @media(max-width:470px) {
        .left {
          grid-template-columns: 1fr
        }

        .panel {
          min-height: 220px
        }
      }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Make Your Own Impossible Object</h1>
        <p class="subtitle">One object, two silhouettes.</p>
      </div>
      <div class="header-row">
        <div class="status" id="status">READY / WEBGL</div>
        <button type="button" class="btn" id="exportBtn">Export to OpenSCAD</button>
      </div>
    </header>
    <main class="workspace" id="workspace">
      <section class="left" id="leftPane">
        <article class="panel front">
          <div class="panel-head"><strong>Front view</strong><span id="frontName">Arrow 3</span></div>
          <div class="preview" id="frontPreview"></div>
          <div class="controls"><select id="frontSelect" aria-label="Front SVG"></select><input class="file-control" id="frontFile"
              type="file" accept="image/svg+xml,.svg" aria-label="Upload front SVG">
            <div class="transform-controls">
              <label class="chk"><input type="checkbox" id="frontFlipV"> Flip V</label>
              <label class="chk"><input type="checkbox" id="frontFlipH"> Flip H</label>
              <label class="chk"><input type="checkbox" id="frontRotate180"> 180°</label>
            </div>
          </div>
        </article>
        <article class="panel back">
          <div class="panel-head"><strong>Rear view</strong><span id="backName">Car</span></div>
          <div class="preview" id="backPreview"></div>
          <div class="controls"><select id="backSelect" aria-label="Rear SVG"></select><input class="file-control" id="backFile" type="file"
              accept="image/svg+xml,.svg" aria-label="Upload rear SVG">
            <div class="transform-controls">
              <label class="chk"><input type="checkbox" id="backFlipV"> Flip V</label>
              <label class="chk"><input type="checkbox" id="backFlipH"> Flip H</label>
              <label class="chk"><input type="checkbox" id="backRotate180"> 180°</label>
            </div>
          </div>
        </article>
      </section>
      <div class="divider" id="divider" aria-label="Resize panels"></div>
      <section class="stages">
        <div class="stage" id="stageFront">
          <canvas id="sceneFront" class="scene-canvas"
            aria-label="Interactive 3D impossible cylinder preview, front view"></canvas>
          <div class="legend">Drag horizontally to orbit · wheel or pinch to zoom</div>
        </div>
        <div class="stage" id="stageBack">
          <canvas id="sceneBack" class="scene-canvas"
            aria-label="Interactive 3D impossible cylinder preview, back view"></canvas>
        </div>
        <div class="scene-controls">
          <div class="range-control"><label for="sampleSlider">Samples</label><input id="sampleSlider" type="range"
              min="32" max="512" step="8" value="248" aria-label="Mesh samples"><output id="sampleValue">248</output></div>
          <div class="range-control"><label for="heightSlider">Height</label><input id="heightSlider" type="range"
              min="0" max="1.5" step="0.01" value="0" aria-label="Object height"></div>
        </div>
      </section>
    </main>
  </div>
  <div class="modal-overlay" id="exportModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
      <div class="modal-head">
        <h2 id="exportModalTitle">Export to OpenSCAD</h2>
        <p>Set starting values for the print — everything here stays editable in OpenSCAD, in the code or the Customizer.</p>
      </div>
      <div class="modal-body">
        <label class="field"><span>Overall width (mm)</span><input type="number" id="scadOverallWidth" step="1" min="1"></label>
        <label class="field"><span>Ribbon thickness (mm)</span><input type="number" id="scadRibbonThickness" step="0.5" min="0.1"></label>
        <label class="field"><span>Wall thickness (mm)</span><input type="number" id="scadWallThickness" step="0.1" min="0.1"></label>
        <label class="field row"><input type="checkbox" id="scadAddLegs" checked><span>Add three legs</span></label>
        <label class="field"><span>Leg diameter (mm)</span><input type="number" id="scadLegDiameter" step="0.1" min="0.1"></label>
        <label class="field"><span>Leg extension length (mm)</span><input type="number" id="scadLegExtension" step="0.5" min="0"></label>
        <label class="field"><span>Leg flare (mm)</span><input type="number" id="scadLegFlare" step="0.5" min="0"></label>
        <label class="field"><span>Foot height (mm)</span><input type="number" id="scadFootHeight" step="0.5" min="0"></label>
        <label class="field"><span>Foot width (mm)</span><input type="number" id="scadFootWidth" step="0.5" min="0"></label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" id="exportCancel">Cancel</button>
        <button type="button" class="btn primary" id="exportDownload">Download .scad</button>
      </div>
    </div>
  </div>
  <script type="module">
    import * as THREE from './three.module.js';
    const SVG_FILES = ['Arrow (curved).svg', 'Arrow (left).svg', 'Arrow (up).svg', 'Batman Logo.svg', 'Car.svg', 'Chick.svg', 'Chicken.svg', 'Circle.svg', 'Egg.svg', 'Fire.svg', 'Heart.svg', 'Hexagon.svg', 'Infinity.svg', 'Pentagon.svg', 'Rabbit.svg', 'Sneaker.svg', 'Square.svg', 'Square (Diamond).svg', 'Star.svg', 'Triangle.svg', 'Turtle.svg', 'Water Drop.svg'];
    const DEMOS = { 'Arrow 3.svg': { viewBox: '0 0 612 792', markup: '<path d="M305 190 L183 350 C174 362 184 378 198 375 L239 368 C249 366 258 374 258 384 L258 583 C258 592 265 599 274 599 L362 599 C371 599 378 592 378 583 L378 384 C378 374 387 366 397 368 L438 375 C452 378 462 362 453 350 L331 190 C325 182 311 182 305 190 Z"/>' }, 'Car.svg': { viewBox: '0 0 612 792', markup: '<path d="M180 324 C170 325 143 327 138 330 C133 333 130 348 130 357 C120 364 124 374 134 377 L174 377 C176 395 188 402 200 402 C213 402 224 394 226 377 L351 378 C353 395 365 402 378 402 C391 402 402 395 404 378 L424 378 C433 377 439 371 439 359 C439 348 433 340 423 336 C412 332 366 329 353 324 C342 319 323 294 313 290 C299 284 247 285 234 290 C220 296 198 315 180 324 Z"/>' } };
    const state = { front: null, back: null, mesh: null, axisOrigin: [0, 0, 0], height: 0, samples: 248, loadToken: { front: 0, back: 0 }, transform: { front: { flipH: false, flipV: false, rotate180: false }, back: { flipH: false, flipV: false, rotate180: false } }, camera: { distance: 1.4, zoom: 1.5, azimuth: Math.PI, elevation: Math.PI / 4 }, drag: null };
    const $ = id => document.getElementById(id), sceneFront = $('sceneFront'), sceneBack = $('sceneBack');
    let rendererFront, rendererBack, cameraFront, cameraBack, world, meshGroup, axisGroup, topEdgeGroup, resizeObserver;
    function options() { for (const id of ['frontSelect', 'backSelect']) $(id).innerHTML = SVG_FILES.map(n => `<option value="${n}">${n.replace(/\.svg$/i, '')}</option>`).join(''); $('frontSelect').value = 'Circle.svg'; $('backSelect').value = 'Square (Diamond).svg'; }
    const SHAPE_SELECTOR = 'path, circle, rect, ellipse, line, polygon, polyline';
    function shapePoint(el, len) { const p = el.getPointAtLength(len), m = el.getCTM(); if (!m) return p; return { x: m.a * p.x + m.c * p.y + m.e, y: m.b * p.x + m.d * p.y + m.f } }
    function svgIntrinsicBox(root) { const vb = root.getAttribute('viewBox'); if (vb) return vb; const w = parseFloat(root.getAttribute('width')) || 100, h = parseFloat(root.getAttribute('height')) || 100; return `0 0 ${w} ${h}` }
    function isBackgroundRect(el, vw, vh) { if (el.tagName.toLowerCase() !== 'rect') return false; const x = parseFloat(el.getAttribute('x')) || 0, y = parseFloat(el.getAttribute('y')) || 0, w = parseFloat(el.getAttribute('width')) || 0, h = parseFloat(el.getAttribute('height')) || 0; return x <= vw * .01 && y <= vh * .01 && w >= vw * .98 && h >= vh * .98 }
    function visibleCandidates(root, viewBox) { const [, , vw, vh] = viewBox.split(/\s+/).map(Number); return Array.from(root.querySelectorAll(SHAPE_SELECTOR)).filter(el => !el.closest('defs, clipPath, symbol, mask, pattern') && !isBackgroundRect(el, vw, vh)) }
    function sampleSegmentPoints(el, count = 400) { const total = el.getTotalLength(), pts = []; for (let i = 0; i <= count; i++) { const p = shapePoint(el, total * i / count); pts.push([p.x, p.y]) } return pts }
    function stitchSegments(segments) { const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]), eps = 1e-6, used = segments.map(() => false); let chain = segments[0].slice(); used[0] = true; for (let remaining = segments.length - 1; remaining > 0; remaining--) { const tail = chain[chain.length - 1]; let best = -1, bestFlip = false, bestDist = Infinity; for (let i = 0; i < segments.length; i++) { if (used[i]) continue; const seg = segments[i], dStart = dist(tail, seg[0]), dEnd = dist(tail, seg[seg.length - 1]); if (dStart < bestDist) { bestDist = dStart; best = i; bestFlip = false } if (dEnd < bestDist) { bestDist = dEnd; best = i; bestFlip = true } } const pts = bestFlip ? segments[best].slice().reverse() : segments[best]; for (const p of pts) if (dist(chain[chain.length - 1], p) > eps) chain.push(p); used[best] = true } return chain }
    function buildClosedPathD(points) { return 'M ' + points.map(p => `${p[0].toFixed(3)},${p[1].toFixed(3)}`).join(' L ') + ' Z' }
    function previewBox(data) { const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', data.viewBox); svg.style.position = 'absolute'; svg.style.visibility = 'hidden'; svg.innerHTML = data.markup; document.body.appendChild(svg); try { const b = svg.getBBox(), p = Math.max(b.width, b.height) * .08; return `${b.x - p} ${b.y - p} ${b.width + 2 * p} ${b.height + 2 * p}` } finally { svg.remove() } }
    function preview(data) { return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${previewBox(data)}" preserveAspectRatio="xMidYMid meet">${data.markup}</svg>` }
    function previewTransformCSS(which) { const f = state.transform[which], parts = []; if (f.flipH) parts.push('scaleX(-1)'); if (f.flipV) parts.push('scaleY(-1)'); if (f.rotate180) parts.push('rotate(180deg)'); return parts.join(' ') }
    function show(which, data, name) { state[which] = data; const svg = $(`${which}Preview`); svg.innerHTML = preview(data); svg.firstElementChild.style.transform = previewTransformCSS(which); svg.firstElementChild.style.transformOrigin = 'center'; $(`${which}Name`).textContent = name.replace(/\.svg$/i, ''); build() }
    function parse(text) {
      const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
      if (doc.querySelector('parsererror')) throw Error('Could not parse this file as SVG');
      const viewBox = svgIntrinsicBox(doc.documentElement);
      // Render into a live, attached SVG (matching the source's own nesting/transforms) so
      // getCTM()/getTotalLength() resolve correctly, then look for the actual curve(s) -
      // ignoring <defs>/<clipPath> content and the full-canvas background rect that
      // GeoGebra (and similar tools) always include in their SVG export.
      const ns = 'http://www.w3.org/2000/svg', measure = document.createElementNS(ns, 'svg');
      measure.setAttribute('viewBox', viewBox);
      measure.style.position = 'absolute';
      measure.style.visibility = 'hidden';
      measure.innerHTML = doc.documentElement.innerHTML;
      document.body.appendChild(measure);
